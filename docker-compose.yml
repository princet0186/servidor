version: '3.8'

services:
  agent-backend:
    build: 
      context: ./agent
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DB=${MONGODB_DB}
      - DYNATRACE_URL=${DYNATRACE_URL}
      - DYNATRACE_TOKEN=${DYNATRACE_TOKEN}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - GCP_PROJECT=${GCP_PROJECT}
    volumes:
      - ./agent:/app

  vitals-ingestion:
    build:
      context: ./services/vitals-ingestion
    ports:
      - "8001:8000"
    environment:
      - PYTHONUNBUFFERED=1

  medication-alerts:
    build:
      context: ./services/medication-alerts
    ports:
      - "8002:8000"
    environment:
      - PYTHONUNBUFFERED=1

  lab-routing:
    build:
      context: ./services/lab-routing
    ports:
      - "8003:8000"
    environment:
      - PYTHONUNBUFFERED=1

  patient-portal:
    build:
      context: ./services/patient-portal
    ports:
      - "8004:8000"
    environment:
      - PYTHONUNBUFFERED=1
